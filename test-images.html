<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
</head>
<body>
    <h1>Testing Product Images</h1>
    
    <!-- Test some of the image paths from the database -->
    <div>
        <h2>Database Image Paths:</h2>
        <img src="/images/products/1749541541251-eyekeeper-eyekeeper-XAJLYKksJSM-unsplash.jpg" alt="Test 1" style="width: 200px; margin: 10px; border: 1px solid #ccc;">
        <img src="/images/products/1749632789198-woman-gold-glasses.png" alt="Test 2" style="width: 200px; margin: 10px; border: 1px solid #ccc;">
        <img src="/images/products/1749636101184-8xssmgef.png" alt="Test 3" style="width: 200px; margin: 10px; border: 1px solid #ccc;">
    </div>
    
    <div>
        <h2>Featured Products Static Images:</h2>
        <img src="/images/products/gold-round-frames.png" alt="Gold Frames" style="width: 200px; margin: 10px; border: 1px solid #ccc;">
        <img src="/images/products/blue-round-frames.png" alt="Blue Frames" style="width: 200px; margin: 10px; border: 1px solid #ccc;">
        <img src="/images/products/black-round-frames.png" alt="Black Frames" style="width: 200px; margin: 10px; border: 1px solid #ccc;">
    </div>
    
    <script>
        // Add error handling to see which images fail to load
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('load', () => {
                console.log('✅ Loaded:', img.src);
            });
            img.addEventListener('error', () => {
                console.error('❌ Failed to load:', img.src);
                img.style.border = '2px solid red';
            });
        });
    </script>
</body>
</html>
